name: MCP Registry Publish (manual)

# Manual re-publish of server.json to the official MCP registry, for when the
# tag-triggered publish job failed (e.g. server.json validation) and the fix
# landed on main afterwards. The registry validates against the PyPI release,
# so the version in server.json must already exist on PyPI.
on:
  workflow_dispatch:

jobs:
  mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC auth for mcp-publisher
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: >
          curl -L
          "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          | tar xz mcp-publisher
      - name: Authenticate to MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json to MCP registry
        run: ./mcp-publisher publish
