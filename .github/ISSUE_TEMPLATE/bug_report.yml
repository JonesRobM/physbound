name: Bug report
description: A PhysBound tool returned a wrong result, crashed, or misbehaved
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For **security issues**, please use
        [private reporting](https://github.com/JonesRobM/physbound/security/advisories/new)
        instead of a public issue.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      description: Which PhysBound tool is affected?
      options:
        - rf_link_budget
        - shannon_hartley
        - noise_floor
        - radar_range
        - antenna_gain
        - radar_ambiguity
        - CLI (physbound check)
        - Server / MCP transport
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      description: The exact inputs you passed to the tool (JSON arguments, CLI flags, or the prompt you gave your assistant).
      placeholder: |
        {"bandwidth_hz": 20e6, "snr_db": 15, "claimed_throughput_bps": 500e6}
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What result did you expect? If you believe the physics is wrong, please cite a source (textbook, standard, paper) for the expected value.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened — the full output, error message, or traceback.
      render: text
    validations:
      required: true
  - type: input
    id: physbound-version
    attributes:
      label: PhysBound version
      description: "`pip show physbound` or `uvx physbound --version` (also stated in tool responses)"
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.4"
  - type: input
    id: client
    attributes:
      label: MCP client and OS
      description: e.g. Claude Desktop on macOS 15, Claude Code CLI on Ubuntu 24.04, Cursor on Windows 11
      placeholder: "Claude Code on macOS 15"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, or additional context.
