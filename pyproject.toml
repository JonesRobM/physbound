[project]
name = "physbound"
version = "0.3.0"
description = "Physical Layer Linter — validates RF link budgets, Shannon capacity, noise floors, antenna gain and radar range/ambiguity claims against hard physical limits"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Robert Jones", email = "jonesrobm@gmail.com" },
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "physics",
    "rf-engineering",
    "link-budget",
    "shannon-hartley",
    "thermal-noise",
    "antenna",
    "signal-processing",
    "validation",
    "ai-hallucination",
    "telecommunications",
    "friis-equation",
    "radar",
    "radar-range-equation",
    "radar-cross-section",
    "doppler",
    "pulse-doppler",
    "antenna-gain",
    "harrington-bound",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.4,<4",
    "pint>=0.25",
    "scipy>=1.15",
    "numpy>=2.2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "hypothesis>=6.100,<7",
    "pre-commit>=4.6,<5",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "python-dotenv>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/JonesRobM/physbound"
Repository = "https://github.com/JonesRobM/physbound"
Issues = "https://github.com/JonesRobM/physbound/issues"

[project.scripts]
physbound = "physbound.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physbound"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
